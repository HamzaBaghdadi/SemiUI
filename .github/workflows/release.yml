name: Release
on:
  push:
    branches: [main]
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      # No `publish:` input here on purpose -- this only opens/updates the "Version Packages" PR
      # (bumps versions, writes changelogs). Publishing to npm stays a manual step
      # (`node scripts/publish-packages.mjs`) so you enter the OTP yourself each time.
      - uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
