<div class="z-radio-group" [attr.data-direction]="direction()">
  @for (option of options(); track $index; let i = $index) {
    <label class="z-radio">
      <input
        type="radio"
        class="z-radio__input"
        [attr.data-size]="size()"
        [name]="groupName"
        [checked]="isSelected(option)"
        [attr.aria-invalid]="effectiveInvalid() ? 'true' : null"
        [disabled]="effectiveDisabled() || isOptionDisabled(option)"
        (change)="select(option)"
        (blur)="handleBlur()"
      />
      <span class="z-radio__dot" [attr.data-size]="size()"></span>
      <span class="z-radio__label">{{ labelFor(option) }}</span>
    </label>
  }
</div>
@if (effectiveInvalid()) {
  <z-error-message [message]="errorMessage()" />
}
