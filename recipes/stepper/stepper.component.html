<div class="z-stepper" role="list">
  @for (item of items(); track $index; let i = $index; let last = $last) {
    <div class="z-stepper__step" role="listitem" [attr.data-state]="stepState(i)">
      <div class="z-stepper__row">
        <button
          type="button"
          class="z-stepper__circle-button"
          [disabled]="!canNavigateTo(i, item)"
          [attr.aria-current]="i === activeIndex() ? 'step' : null"
          [attr.aria-label]="'Step ' + (i + 1) + ': ' + item.label"
          (click)="selectStep(i, item)"
        >
          <span class="z-stepper__circle">
            @if (stepState(i) === 'completed') {
              <z-icon [ref]="icons.checkboxCheck" animate.enter="z-stepper__check--enter" />
            } @else {
              {{ i + 1 }}
            }
          </span>
        </button>
        @if (!last) {
          <span class="z-stepper__connector"></span>
        }
      </div>
      <div class="z-stepper__label-group">
        <span class="z-stepper__label">{{ item.label }}</span>
        @if (item.description) {
          <span class="z-stepper__description">{{ item.description }}</span>
        }
      </div>
    </div>
  }
</div>

@if (contentTemplate(); as tpl) {
  <!-- Keyed on activeIndex() rather than a plain @if so Angular tears down and recreates this view
       -- and replays animate.enter -- on every step change, not just the panel's first appearance
       (an @if only re-runs when truthiness flips, not when the active item's identity changes).
       Enter-only (no animate.leave): overlapping a leave animation with the next step's enter
       would need the leaving copy pulled out of flow (position: absolute) to avoid a layout jump,
       which needs a stable positioning context this simple margin-based layout doesn't have. -->
  @for (activeItem of [items()[activeIndex()]]; track activeIndex()) {
    <div class="z-stepper__panel" animate.enter="z-stepper__panel--enter">
      <ng-container [ngTemplateOutlet]="tpl" [ngTemplateOutletContext]="{ $implicit: activeItem, index: activeIndex() }" />
    </div>
  }
}
