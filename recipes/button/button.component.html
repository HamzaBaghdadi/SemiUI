<button
  class="s-button"
  [class.s-button--loading]="loading()"
  sButton
  [disabled]="isDisabled()"
  [attr.aria-busy]="loading() ? 'true' : null"
  (pressed)="pressed.emit()"
>
  @if (loading()) {
    <s-icon class="s-button__icon s-button__icon--spin" [ref]="loadingIcon()" />
  }
  @if (showLeadingIcon()) {
    <s-icon class="s-button__icon" [ref]="iconLeading()!" />
  }
  @if (!icon()) {
    <span class="s-button__label"><ng-content /></span>
  } @else {
    <!-- Invisible one-line spacer (a zero-width space): gives icon-only mode a real text line box
         to size against, so it ends up exactly as tall as a labeled button. See the
         [data-icon-only] block in this component's CSS. -->
    <span class="s-button__height-spacer" aria-hidden="true">&#8203;</span>
  }
  @if (showTrailingIcon()) {
    <s-icon class="s-button__icon" [ref]="iconTrailing()!" />
  }
</button>
