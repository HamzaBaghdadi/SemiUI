<label class="s-checkbox">
  <input
    #nativeInput
    type="checkbox"
    class="s-checkbox__input"
    [attr.data-size]="size()"
    [checked]="value()"
    [indeterminate]="indeterminate()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-invalid]="effectiveInvalid() ? 'true' : null"
    [disabled]="effectiveDisabled()"
    (change)="onChange($any($event.target).checked)"
    (blur)="handleBlur()"
  />
  <span class="s-checkbox__box" [attr.data-size]="size()">
    @if (indeterminate()) {
      <s-icon [ref]="icons.checkboxIndeterminate" />
    } @else if (value()) {
      <s-icon [ref]="icons.checkboxCheck" />
    }
  </span>
  @if (label()) {
    <span class="s-checkbox__label">{{ label() }}</span>
  }
</label>
@if (effectiveInvalid()) {
  <s-error-message [message]="errorMessage()" />
}
