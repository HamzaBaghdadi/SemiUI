<header
  class="sticky top-0 flex items-center h-16 bg-background/80 backdrop-blur-md z-1 border-b border-border"
>
  <div class="flex items-center px-6 gap-4 w-full m-auto max-w-295">
    <div
      class="min-w-0 flex items-center gap-2 cursor-pointer"
      routerLink="/"
      (click)="rotateLogo()"
    >
      <img
        src="/logo.svg"
        alt="SemiUI Logo"
        class="h-8 w-8 duration-200"
        [style.transform]="'rotate(' + rotateDeg() + 'deg)'"
      />
      <h1 class="text-2xl font-bold">SemiUI</h1>
      <s-tag class="font-bold ms-2" variant="primary">v0.5.0</s-tag>
    </div>

    <div class="flex items-center gap-6 justify-end flex-1">
      <div class="flex items-center gap-1">
        @for (item of menuItems(); track $index) {
          <a
            class="py-2 px-3 text-muted-foreground text-sm rounded-md font-medium hover:text-foreground hover:bg-muted"
            [routerLink]="item.link"
            routerLinkActive="text-primary! bg-primary/10!"
            >{{ item.label }}</a
          >
        }
      </div>
      <div class="flex items-center gap-2">
        <s-button
          (click)="openGithub()"
          icon
          [iconLeading]="githubIcon"
          sTooltip="GitHub"
          variant="contrast"
          text
          size="lg"
        ></s-button>
        <s-button
          (click)="themePopover.toggle($event)"
          icon
          [iconLeading]="{ type: 'ng-icon', name: 'lucidePalette' }"
          sTooltip="Customize theme"
          variant="contrast"
          text
          size="lg"
        ></s-button>
        <s-popover #themePopover placement="bottom" [showArrow]="false">
          <div class="flex flex-col gap-4 w-56">
            <div class="flex flex-col gap-1">
              <span class="text-sm font-medium text-muted-foreground"
                >Preset</span
              >
              <s-select
                [options]="presetOptions"
                optionLabel="label"
                [value]="selectedPresetOption()"
                [clearable]="false"
                [filterable]="false"
                placeholder="Preset"
                (valueChange)="onPresetChange($event)"
              ></s-select>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-sm font-medium text-muted-foreground">RTL</span>
              <s-switch
                [value]="rtlService.rtl()"
                size="sm"
                (valueChange)="rtlService.toggleRtl()"
              ></s-switch>
            </div>
          </div>
        </s-popover>
        <s-button
          (click)="this.colorModeService.toggle()"
          icon
          [iconLeading]="{
            type: 'ng-icon',
            name: this.colorModeService.dark() ? 'lucideSun' : 'lucideMoon',
          }"
          [sTooltip]="
            this.colorModeService.dark()
              ? 'Switch to light mode'
              : 'Switch to dark mode'
          "
          variant="contrast"
          text
          size="lg"
        ></s-button>
      </div>
    </div>
  </div>
</header>
