<div class="s-accordion">
  @for (item of items(); track $index; let i = $index) {
    <div class="s-accordion__item" [attr.data-expanded]="isOpen(i) ? '' : null" [attr.data-disabled]="item.disabled ? '' : null">
      <h3 class="s-accordion__header-wrap">
        <button
          type="button"
          class="s-accordion__header"
          [id]="headerId(i)"
          [attr.aria-expanded]="isOpen(i)"
          [attr.aria-controls]="panelId(i)"
          [disabled]="item.disabled"
          (click)="toggle(i, item)"
        >
          <span class="s-accordion__header-label">
            @if (headerTemplate(); as tpl) {
              <ng-container [ngTemplateOutlet]="tpl" [ngTemplateOutletContext]="{ $implicit: item, index: i }" />
            } @else {
              {{ item.header }}
            }
          </span>
          <s-icon class="s-accordion__chevron" [ref]="icons.chevronDown" />
        </button>
      </h3>
      <div class="s-accordion__panel" [id]="panelId(i)" role="region" [attr.aria-labelledby]="headerId(i)">
        <div class="s-accordion__panel-inner">
          <div class="s-accordion__panel-content">
            <ng-container [ngTemplateOutlet]="contentTemplate()" [ngTemplateOutletContext]="{ $implicit: item, index: i }" />
          </div>
        </div>
      </div>
    </div>
  }
</div>
