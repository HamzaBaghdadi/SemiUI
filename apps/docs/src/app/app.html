<div class="shell">
  <header class="shell__header">
    <a class="shell__brand" routerLink="/">{{ title }}</a>
  </header>
  <div class="shell__body">
    <nav class="shell__nav">
      <h2>Components</h2>
      <ul>
        @for (component of components; track component.path) {
          <li>
            <a [routerLink]="component.path" routerLinkActive="is-active">{{ component.label }}</a>
          </li>
        }
      </ul>
    </nav>
    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
