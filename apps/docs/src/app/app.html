<div class="shell">
  <header class="shell__header">
    <a class="shell__brand" routerLink="/">{{ title }}</a>
    <button type="button" class="shell__mode-toggle" (click)="colorMode.toggle()">
      {{ colorMode.dark() ? 'Light mode' : 'Dark mode' }}
    </button>
  </header>
  <div class="shell__body">
    <nav class="shell__nav">
      <h2>Getting Started</h2>
      <ul>
        @for (item of gettingStarted; track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="is-active">{{ item.label }}</a>
          </li>
        }
      </ul>

      <h2>Guides</h2>
      <ul>
        @for (item of guides; track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="is-active">{{ item.label }}</a>
          </li>
        }
      </ul>

      <h2>Components</h2>
      <ul>
        @for (item of components; track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="is-active">{{ item.label }}</a>
          </li>
        }
      </ul>
    </nav>
    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
