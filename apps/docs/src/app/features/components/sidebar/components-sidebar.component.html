<nav
  class="flex flex-col gap-1 max-h-[calc(100vh-6rem)] overflow-y-auto pr-1 sticky top-0"
>
  <div class="relative mb-3">
    <ng-icon
      name="lucideSearch"
      class="absolute left-2.5 top-1/2 -translate-y-1/2 text-muted-foreground text-xs"
    ></ng-icon>
    <input
      type="text"
      placeholder="Search components"
      class="w-full pl-8 pr-3 py-2 text-sm rounded-md border border-border bg-background text-foreground placeholder:text-muted-foreground focus:outline-none focus:border focus:border-primary"
      [value]="query()"
      (input)="onQueryInput($event)"
    />
  </div>

  @for (group of groups(); track group.category) {
    <div class="flex flex-col gap-0.5 mb-3">
      <span
        class="px-2 mb-1 text-xs font-bold uppercase tracking-[0.06em] text-muted-foreground"
        >{{ group.category }}</span
      >
      @for (item of group.items; track item.slug) {
        <a
          [routerLink]="['/components', item.slug]"
          routerLinkActive="bg-primary/10! text-primary!"
          class="flex items-center justify-between gap-2 px-2 py-1.5 rounded-md text-sm text-foreground hover:bg-muted"
        >
          <span>{{ item.name }}</span>
          @if (item.status === 'soon') {
            <span
              class="text-[0.625rem] uppercase font-bold text-muted-foreground border border-border rounded-full px-1.5 py-0.5 leading-none"
              >Soon</span
            >
          }
        </a>
      }
    </div>
  }

  @if (groups().length === 0) {
    <span class="px-2 py-4 text-sm text-muted-foreground"
      >No components match "{{ query() }}".</span
    >
  }
</nav>
