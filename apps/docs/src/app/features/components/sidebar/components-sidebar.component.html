<nav
  class="flex flex-col gap-1 max-h-[calc(100vh-6rem)] overflow-y-auto pr-1 sticky top-0"
>
  <s-icon-field class="mb-3" [icon]="{ type: 'ng-icon', name: 'lucideSearch' }">
    <s-text-input
      [value]="query()"
      (input)="onQueryInput($event)"
      placeholder="Search components"
    />
  </s-icon-field>

  @for (group of groups(); track group.category) {
    <div class="flex flex-col gap-0.5 mb-3">
      <span
        class="px-2 mb-1 text-xs font-bold uppercase tracking-[0.06em] text-muted-foreground"
        >{{ group.category }}</span
      >
      @for (item of group.items; track item.slug) {
        <a
          [routerLink]="['/components', item.slug]"
          routerLinkActive="bg-primary/10! text-primary!"
          class="flex items-center px-2 py-1.5 rounded-md text-sm text-foreground hover:bg-muted"
        >
          {{ item.name }}
        </a>
      }
    </div>
  }

  @if (groups().length === 0) {
    <span class="px-2 py-4 text-sm text-muted-foreground"
      >No components match "{{ query() }}".</span
    >
  }
</nav>
