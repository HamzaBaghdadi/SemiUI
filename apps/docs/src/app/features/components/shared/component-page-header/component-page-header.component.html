<div class="flex flex-col gap-2">
  <span
    class="inline-flex items-center gap-2 text-primary tracking-[0.08em] font-semibold uppercase text-xs before:size-1.5 before:rounded-full before:bg-primary"
    >{{ category() }}</span
  >
  <h1 class="text-3xl font-extrabold">{{ name() }}</h1>
  <p class="text-muted-foreground max-w-xl">{{ description() }}</p>
  <app-code-block
    class="max-w-md mt-2"
    filename="Terminal"
    [code]="installCommand()"
  ></app-code-block>
</div>
