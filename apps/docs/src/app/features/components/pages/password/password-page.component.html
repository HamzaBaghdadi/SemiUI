<div class="flex flex-col gap-10">
  <app-component-page-header
    category="Forms"
    name="Password"
    description="Wraps the same behavior as Text Input, plus a reveal toggle controlled by showMask."
    slug="password"
  ></app-component-page-header>

  <div class="flex flex-col gap-3">
    <h2 class="text-xl font-bold">ngModel</h2>
    <app-component-demo>
      <s-password [(ngModel)]="password" placeholder="Password" />
    </app-component-demo>
    <app-code-block filename="Usage" [code]="ngModelCode"></app-code-block>
  </div>

  <div class="flex flex-col gap-3">
    <h2 class="text-xl font-bold">Reactive forms + validation</h2>
    <app-component-demo [formGroup]="reactiveForm">
      <s-password
        formControlName="password"
        placeholder="At least 8 characters"
        errorMessage="Password must be at least 8 characters"
      />
    </app-component-demo>
    <app-code-block filename="Usage" [code]="reactiveFormsCode"></app-code-block>
  </div>

  <div class="flex flex-col gap-3">
    <h2 class="text-xl font-bold">showMask</h2>
    <p class="text-sm text-muted-foreground max-w-xl">
      <code class="text-xs bg-muted px-1.5 py-0.5 rounded-sm">showMask</code> controls whether the
      show/hide toggle button renders at all.
    </p>
    <app-component-demo>
      <s-password [showMask]="maskEnabled()" placeholder="Password" />
      <s-button variant="secondary" (pressed)="toggleMask()">
        {{ maskEnabled() ? 'Hide the reveal toggle' : 'Show the reveal toggle' }}
      </s-button>
    </app-component-demo>
    <app-code-block filename="Usage" [code]="showMaskCode"></app-code-block>
  </div>
</div>
