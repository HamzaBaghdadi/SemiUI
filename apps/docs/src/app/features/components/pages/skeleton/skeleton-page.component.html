<div class="flex flex-col gap-10">
  <app-component-page-header
    category="Data display"
    name="Skeleton"
    description="A shimmering loading placeholder block. Use shape='text' with lines for paragraph-style placeholders -- the last line renders shorter, like real text."
    slug="skeleton"
  ></app-component-page-header>

  <div class="flex flex-col gap-3">
    <h2 class="text-xl font-bold">Shapes</h2>
    <app-component-demo [block]="true">
      <div class="flex flex-col gap-4">
        <s-skeleton height="1.25rem" width="60%" />
        <s-skeleton shape="circle" width="3rem" height="3rem" />
        <s-skeleton shape="text" [lines]="3" />
      </div>
    </app-component-demo>
    <app-code-block filename="Usage" [code]="shapesCode"></app-code-block>
  </div>

  <div class="flex flex-col gap-3">
    <h2 class="text-xl font-bold">Composing a card placeholder</h2>
    <app-component-demo>
      <div class="flex gap-3 items-center w-80">
        <s-skeleton shape="circle" width="2.5rem" height="2.5rem" />
        <div class="flex-1 flex flex-col gap-2">
          <s-skeleton height="0.875rem" width="50%" />
          <s-skeleton height="0.75rem" width="80%" />
        </div>
      </div>
    </app-component-demo>
  </div>

  <div class="flex flex-col gap-3">
    <h2 class="text-xl font-bold">No animation</h2>
    <app-component-demo>
      <s-skeleton [animated]="false" width="10rem" height="1.25rem" />
    </app-component-demo>
    <app-code-block filename="Usage" [code]="noAnimationCode"></app-code-block>
  </div>
</div>
