<div class="flex flex-col gap-8">
  <app-component-page-header
    [category]="entry.category"
    [name]="entry.name"
    [description]="entry.summary"
    [slug]="entry.slug"
  ></app-component-page-header>

  <div
    class="flex flex-col items-center gap-3 text-center rounded-lg border border-dashed border-border py-20 px-6"
  >
    <ng-icon name="lucideWrench" class="text-muted-foreground text-xl"></ng-icon>
    <p>
      <strong class="text-foreground">{{ entry.name }}</strong>
      <span class="text-muted-foreground"> isn't written up here yet.</span>
    </p>
    <p class="text-sm text-muted-foreground max-w-md">
      The CLI already copies its real source into your project with the
      command above -- this page will fill in with live demos and code
      samples the same way Button, Tag, Checkbox, Text Input, and Accordion
      already have.
    </p>
  </div>
</div>
