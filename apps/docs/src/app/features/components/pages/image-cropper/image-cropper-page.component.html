<div class="flex flex-col gap-10">
  <app-component-page-header
    category="Forms"
    name="Image Cropper"
    description="A pan/zoom image cropper: a fixed crop frame stays put while the image is dragged and zoomed underneath it."
    slug="image-cropper"
  ></app-component-page-header>

  <app-component-page-tabs>
    <ng-template #features>
      <div class="flex flex-col gap-10">
        <div class="flex flex-col gap-3">
          <h2 class="text-xl font-bold">Basic usage</h2>
          <p class="text-sm text-muted-foreground max-w-xl">
            Drag to pan, scroll or use the slider to zoom. Upload your own image, or crop the generated sample.
          </p>
          <app-component-demo [block]="true">
            <div class="flex flex-col items-center gap-4 w-full">
              <s-image-cropper #cropper [src]="imageSrc()" [aspectRatio]="1" />
              <div class="flex gap-2">
                <input #fileInput type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)" />
                <button type="button" class="text-sm px-3 py-1.5 rounded-md border" (click)="pickFile()">Upload image</button>
                <button type="button" class="text-sm px-3 py-1.5 rounded-md border" (click)="cropImage()">Crop</button>
                <button type="button" class="text-sm px-3 py-1.5 rounded-md border" (click)="resetCropper()">Reset</button>
              </div>
              @if (croppedPreview(); as preview) {
                <div class="flex flex-col items-center gap-2">
                  <span class="text-sm text-muted-foreground">Result</span>
                  <img [src]="preview" alt="Cropped result" class="rounded-md border" style="width: 140px; height: 140px;" />
                </div>
              }
            </div>
          </app-component-demo>
          <app-code-block filename="Usage" [code]="basicCode"></app-code-block>
        </div>

        <div class="flex flex-col gap-3">
          <h2 class="text-xl font-bold">Widescreen aspect ratio</h2>
          <app-component-demo [block]="true">
            <s-image-cropper [src]="imageSrc()" [aspectRatio]="16 / 9" [viewportSize]="200" />
          </app-component-demo>
          <app-code-block filename="Usage" [code]="wideCode"></app-code-block>
        </div>
      </div>
    </ng-template>

    <ng-template #api>
      <div class="flex flex-col gap-8">
        <app-api-table [props]="apiProps" [events]="apiEvents"></app-api-table>
        <div class="flex flex-col gap-3">
          <h2 class="text-lg font-bold">Methods</h2>
          <app-api-table [props]="apiMethods" [events]="[]"></app-api-table>
        </div>
      </div>
    </ng-template>

    <ng-template #theming>
      <app-theming-table [cssClasses]="themingCssClasses" [cssVariables]="themingCssVariables"></app-theming-table>
    </ng-template>
  </app-component-page-tabs>
</div>
