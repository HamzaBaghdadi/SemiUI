<div class="flex flex-col gap-10">
  <app-component-page-header
    category="Data display"
    name="Splitter"
    description="Resizable panes divided by a draggable gutter -- pass panels as ng-template sSplitterPanel children, horizontal or vertical."
    slug="splitter"
  ></app-component-page-header>

  <app-component-page-tabs>
    <ng-template #features>
      <div class="flex flex-col gap-10">
        <div class="flex flex-col gap-3">
          <h2 class="text-xl font-bold">Basic usage</h2>
          <p class="text-sm text-muted-foreground max-w-xl">
            Drag the gutter, or focus it and use the arrow keys.
          </p>
          <app-component-demo [block]="true">
            <s-splitter style="height: 16rem; width: 100%">
              <ng-template sSplitterPanel [size]="30" [minSize]="15">
                <div class="p-4">Sidebar</div>
              </ng-template>
              <ng-template sSplitterPanel [size]="70" [minSize]="30">
                <div class="p-4">Main content</div>
              </ng-template>
            </s-splitter>
          </app-component-demo>
          <app-code-block filename="Usage" [code]="basicCode"></app-code-block>
        </div>

        <div class="flex flex-col gap-3">
          <h2 class="text-xl font-bold">Three panels</h2>
          <app-component-demo [block]="true">
            <s-splitter style="height: 16rem; width: 100%">
              <ng-template sSplitterPanel [size]="20" [minSize]="10">
                <div class="p-4">Left</div>
              </ng-template>
              <ng-template sSplitterPanel [size]="50" [minSize]="20">
                <div class="p-4">Center</div>
              </ng-template>
              <ng-template sSplitterPanel [size]="30" [minSize]="10">
                <div class="p-4">Right</div>
              </ng-template>
            </s-splitter>
          </app-component-demo>
          <app-code-block filename="Usage" [code]="threePanelCode"></app-code-block>
        </div>

        <div class="flex flex-col gap-3">
          <h2 class="text-xl font-bold">Vertical orientation</h2>
          <app-component-demo [block]="true">
            <s-splitter orientation="vertical" style="height: 20rem; width: 100%">
              <ng-template sSplitterPanel [size]="40" [minSize]="15">
                <div class="p-4">Top</div>
              </ng-template>
              <ng-template sSplitterPanel [size]="60" [minSize]="15">
                <div class="p-4">Bottom</div>
              </ng-template>
            </s-splitter>
          </app-component-demo>
          <app-code-block filename="Usage" [code]="verticalCode"></app-code-block>
        </div>
      </div>
    </ng-template>

    <ng-template #api>
      <div class="flex flex-col gap-8">
        <div class="flex flex-col gap-3">
          <h2 class="text-lg font-bold">s-splitter</h2>
          <app-api-table [props]="apiProps" [events]="apiEvents"></app-api-table>
        </div>
        <div class="flex flex-col gap-3">
          <h2 class="text-lg font-bold">ng-template[sSplitterPanel]</h2>
          <app-api-table [props]="panelApiProps" [events]="[]"></app-api-table>
        </div>
      </div>
    </ng-template>

    <ng-template #theming>
      <app-theming-table
        [dataAttributes]="themingDataAttributes"
        [cssClasses]="themingCssClasses"
        [cssVariables]="themingCssVariables"
      ></app-theming-table>
    </ng-template>
  </app-component-page-tabs>
</div>
