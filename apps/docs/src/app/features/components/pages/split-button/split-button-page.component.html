<div class="flex flex-col gap-10">
  <app-component-page-header
    category="Actions"
    name="Split Button"
    description="A primary action with a caret that opens a menu of secondary actions -- styled directly against Button's design tokens, with Popover for the menu."
    slug="split-button"
  ></app-component-page-header>

  <app-component-page-tabs>
    <ng-template #features>
      <div class="flex flex-col gap-10">
        <div class="flex flex-col gap-3">
          <h2 class="text-xl font-bold">Basic usage</h2>
          <app-component-demo>
            <s-split-button [items]="exportItems" (pressed)="onPressed()" (itemSelected)="onItemSelected($event)">
              Save
            </s-split-button>
          </app-component-demo>
          <p class="text-sm text-muted-foreground">{{ log() || 'Press the main action or pick a menu item.' }}</p>
          <app-code-block filename="Usage" [code]="basicCode"></app-code-block>
        </div>

        <div class="flex flex-col gap-3">
          <h2 class="text-xl font-bold">Variants</h2>
          <app-component-demo>
            <s-split-button variant="secondary" [items]="exportItems">Save</s-split-button>
            <s-split-button variant="destructive" [items]="exportItems">Delete</s-split-button>
          </app-component-demo>
          <app-code-block filename="Usage" [code]="variantsCode"></app-code-block>
        </div>

        <div class="flex flex-col gap-3">
          <h2 class="text-xl font-bold">Sizes</h2>
          <app-component-demo>
            <s-split-button size="sm" [items]="exportItems">Save</s-split-button>
            <s-split-button size="md" [items]="exportItems">Save</s-split-button>
            <s-split-button size="lg" [items]="exportItems">Save</s-split-button>
          </app-component-demo>
          <app-code-block filename="Usage" [code]="sizesCode"></app-code-block>
        </div>
      </div>
    </ng-template>

    <ng-template #api>
      <app-api-table [props]="apiProps" [events]="apiEvents"></app-api-table>
    </ng-template>

    <ng-template #theming>
      <app-theming-table [cssClasses]="themingCssClasses" [cssVariables]="themingCssVariables"></app-theming-table>
    </ng-template>
  </app-component-page-tabs>
</div>
