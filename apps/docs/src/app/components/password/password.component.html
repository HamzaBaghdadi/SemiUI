<div class="s-password">
  <input
    #nativeInput
    sInput
    class="s-password__input"
    [type]="inputType()"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="effectiveDisabled()"
    [invalid]="effectiveInvalid()"
    (input)="onInput($any($event.target).value)"
    (blur)="handleBlur()"
  />
  @if (showMask()) {
    <button
      type="button"
      class="s-password__toggle"
      sButton
      [disabled]="effectiveDisabled()"
      [attr.aria-label]="revealed() ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="revealed()"
      (pressed)="toggleReveal()"
    >
      <s-icon [ref]="toggleIcon()" />
    </button>
  }
</div>
@if (effectiveInvalid()) {
  <s-error-message [message]="errorMessage()" />
}
