@if (open()) {
  <div
    #panel
    class="s-popover"
    role="dialog"
    [attr.data-placement]="resolvedPlacement()"
    [attr.data-arrow]="showArrow() ? '' : null"
    [style.top.px]="position().top"
    [style.left.px]="position().left"
    [style.--s-popover-arrow-offset.px]="arrowOffset()"
    animate.enter="s-popover--enter"
    animate.leave="s-popover--leave"
  >
    <ng-content />
  </div>
}
