<div class="s-rating" (mouseleave)="onGroupLeave()">
  @for (star of starIndices(); track star) {
    <button
      type="button"
      class="s-rating__star"
      [class.s-rating__star--filled]="star <= displayValue()"
      [disabled]="effectiveDisabled() || readOnly()"
      [attr.aria-label]="'Rate ' + star + (star === 1 ? ' star' : ' stars')"
      [attr.aria-pressed]="star <= (value() ?? 0)"
      (click)="onStarClick(star)"
      (mouseenter)="onStarEnter(star)"
      (blur)="handleBlur()"
    >
      <s-icon [ref]="icons.rating" />
    </button>
  }
</div>
@if (effectiveInvalid()) {
  <s-error-message [message]="errorMessage()" />
}
