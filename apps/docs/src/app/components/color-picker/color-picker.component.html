<ng-template #pickerContent>
  <div
    #svArea
    class="s-color-picker__sv-area"
    [style.background-color]="hueColor()"
    (pointerdown)="onSvPointerDown($event)"
    (pointermove)="onSvPointerMove($event)"
    (pointerup)="onSvPointerUp()"
    (pointercancel)="onSvPointerUp()"
  >
    <div
      class="s-color-picker__sv-thumb"
      [style.left.%]="hsv().s"
      [style.top.%]="100 - hsv().v"
      [style.background-color]="thumbColor()"
    ></div>
  </div>

  <div #hueTrack class="s-color-picker__hue-track" (pointerdown)="onHuePointerDown($event)" (pointermove)="onHuePointerMove($event)" (pointerup)="onHuePointerUp()" (pointercancel)="onHuePointerUp()">
    <div class="s-color-picker__hue-thumb" [style.left.%]="(hsv().h / 360) * 100" [style.background-color]="hueColor()"></div>
  </div>

  <div class="s-color-picker__hex-row">
    <span class="s-color-picker__hex-prefix">#</span>
    <input
      #hexInputEl
      type="text"
      class="s-color-picker__hex-input"
      spellcheck="false"
      maxlength="7"
      [value]="hexInputDisplay()"
      (input)="onHexInputChange('#' + $any($event.target).value)"
      (blur)="onHexInputCommit()"
      (keydown.enter)="onHexInputCommit()"
    />
  </div>

  @if (showPresets() && presets().length > 0) {
    <div class="s-color-picker__presets">
      @for (preset of presets(); track preset) {
        <button
          type="button"
          class="s-color-picker__preset"
          [style.background-color]="preset"
          [attr.aria-label]="'Select color ' + preset"
          [attr.data-selected]="value() === preset ? '' : null"
          (click)="selectPreset(preset)"
        ></button>
      }
    </div>
  }
</ng-template>

@if (inline()) {
  <div class="s-color-picker__inline-panel">
    <ng-container [ngTemplateOutlet]="pickerContent" />
  </div>
} @else {
  <button
    #triggerButton
    type="button"
    class="s-color-picker__trigger"
    [attr.aria-expanded]="open()"
    [attr.aria-invalid]="effectiveInvalid() ? 'true' : null"
    [disabled]="effectiveDisabled()"
    (click)="toggle()"
  >
    <span class="s-color-picker__swatch" [attr.data-empty]="value() ? null : ''" [style.background-color]="value() ?? 'transparent'"></span>
    @if (showValueText()) {
      <span class="s-color-picker__value-text">
        @if (value()) {
          {{ value() }}
        } @else {
          <span class="s-color-picker__placeholder">{{ placeholder() }}</span>
        }
      </span>
    }
  </button>

  @if (open()) {
    <div class="s-color-picker__panel" [attr.data-placement]="panelPlacement()" animate.enter="s-color-picker__panel--enter" animate.leave="s-color-picker__panel--leave">
      <ng-container [ngTemplateOutlet]="pickerContent" />
    </div>
  }
}

@if (effectiveInvalid()) {
  <s-error-message [message]="errorMessage()" />
}
