<div class="s-textarea-wrapper">
  <textarea
    #nativeTextarea
    sInput
    class="s-textarea"
    [class.s-textarea--auto-resize]="autoResize()"
    [placeholder]="placeholder()"
    [rows]="rows()"
    [attr.maxlength]="maxLength() ?? null"
    [value]="value()"
    [disabled]="effectiveDisabled()"
    [invalid]="effectiveInvalid()"
    [attr.autocomplete]="disableAutocomplete() ? 'off' : null"
    (input)="onInput($any($event.target).value)"
    (blur)="handleBlur()"
  ></textarea>
  @if (maxLength(); as max) {
    <span class="s-textarea__count"
      ><span>{{ characterCount() }}</span
      ><span>/</span><span>{{ max }}</span></span
    >
  }
</div>
@if (effectiveInvalid()) {
  <s-error-message [message]="errorMessage()" />
}
