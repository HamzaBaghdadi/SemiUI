<div class="s-otp" (paste)="onPaste($event)">
  @for (i of indices(); track i) {
    <input
      #box
      [type]="mask() ? 'password' : 'text'"
      [attr.inputmode]="type() === 'numeric' ? 'numeric' : 'text'"
      class="s-otp__box"
      maxlength="1"
      [attr.autocomplete]="disableAutocomplete() ? 'off' : 'one-time-code'"
      [attr.aria-label]="'Digit ' + (i + 1)"
      [attr.aria-invalid]="effectiveInvalid() ? 'true' : null"
      [value]="digits()[i]"
      [disabled]="effectiveDisabled()"
      (input)="onBoxInput(i, $any($event.target).value)"
      (keydown)="onBoxKeydown(i, $event)"
      (blur)="handleBlur()"
    />
  }
</div>
@if (effectiveInvalid()) {
  <s-error-message [message]="errorMessage()" />
}
