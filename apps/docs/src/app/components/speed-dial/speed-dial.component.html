<div class="s-speed-dial__actions" role="menu">
  @for (item of items(); track $index; let i = $index) {
    <button
      type="button"
      class="s-speed-dial__action"
      role="menuitem"
      [style.--s-speed-dial-index]="i"
      [attr.aria-label]="item.label"
      [attr.title]="item.label"
      [disabled]="item.disabled"
      (click)="selectItem(item)"
    >
      @if (item.icon) {
        <s-icon [ref]="item.icon" />
      }
    </button>
  }
</div>
<s-button
  class="s-speed-dial__trigger"
  icon
  [variant]="variant()"
  [size]="size()"
  [disabled]="disabled()"
  [iconLeading]="open() ? (openIcon() ?? icons.clear) : (icon() ?? icons.plus)"
  [attr.aria-expanded]="open()"
  aria-haspopup="menu"
  aria-label="Toggle actions"
  (pressed)="toggle()"
></s-button>
