@if (open()) {
  <!-- Escape (handled separately via @HostListener) is the keyboard-equivalent way to dismiss;
       the backdrop itself is a decorative pointer-only affordance, not a focusable control. -->
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div
    #backdrop
    class="s-dialog__backdrop"
    [attr.data-blur]="blurBackdrop() ? '' : null"
    [attr.data-hidden]="showBackdrop() ? null : ''"
    (click)="onBackdropClick()"
    animate.enter="s-dialog__backdrop--enter"
    animate.leave="s-dialog__backdrop--leave"
  >
    <div
      #panel
      class="s-dialog__panel"
      [attr.data-size]="size()"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title() || null"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown)="onPanelKeydown($event)"
      animate.enter="s-dialog__panel--enter"
      animate.leave="s-dialog__panel--leave"
    >
      @if (headlessTemplate(); as tpl) {
        <ng-container [ngTemplateOutlet]="tpl" />
      } @else {
        @if (headerTemplate(); as tpl) {
          <div class="s-dialog__header">
            <div class="s-dialog__header-content"><ng-container [ngTemplateOutlet]="tpl" /></div>
            @if (closable()) {
              <button type="button" class="s-dialog__close" aria-label="Close" (click)="hide()">
                <s-icon [ref]="icons.clear" />
              </button>
            }
          </div>
        } @else if (title() || closable()) {
          <div class="s-dialog__header">
            <h2 class="s-dialog__title">{{ title() }}</h2>
            @if (closable()) {
              <button type="button" class="s-dialog__close" aria-label="Close" (click)="hide()">
                <s-icon [ref]="icons.clear" />
              </button>
            }
          </div>
        }
        <div class="s-dialog__body">
          <ng-content />
        </div>
        @if (footerTemplate(); as tpl) {
          <div class="s-dialog__footer">
            <ng-container [ngTemplateOutlet]="tpl" />
          </div>
        }
      }
    </div>
  </div>
}
