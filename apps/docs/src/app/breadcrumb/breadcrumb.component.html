<nav aria-label="Breadcrumb">
  <ol class="s-breadcrumb">
    @for (item of items(); track $index; let last = $last) {
      <li class="s-breadcrumb__item">
        @if (item.link) {
          <a
            class="s-breadcrumb__link"
            [routerLink]="item.link"
            routerLinkActive="s-breadcrumb__link--current"
            [routerLinkActiveOptions]="{ exact: true }"
            #rla="routerLinkActive"
            [attr.aria-current]="rla.isActive ? 'page' : null"
            >{{ item.label }}</a
          >
        } @else {
          <span class="s-breadcrumb__current" [attr.aria-current]="last ? 'page' : null">{{ item.label }}</span>
        }
        @if (!last) {
          <s-icon class="s-breadcrumb__separator" [ref]="icons.chevronDown" />
        }
      </li>
    }
  </ol>
</nav>
