<main>
  <h1>{{ title }}</h1>
  <button type="button" (click)="colorMode.toggle()">
    {{ colorMode.dark() ? 'Switch to light mode' : 'Switch to dark mode' }}
  </button>

  <section>
    <h2>Variants</h2>
    @for (variant of variants; track variant) {
      <s-button [variant]="variant" (pressed)="clickCount = clickCount + 1">{{ variant }}</s-button>
    }
  </section>

  <section>
    <h2>Sizes</h2>
    @for (size of sizes; track size) {
      <s-button [size]="size" (pressed)="clickCount = clickCount + 1">Size {{ size }}</s-button>
    }
    <s-button icon [iconLeading]="saveIcon" aria-label="Save" (pressed)="clickCount = clickCount + 1" />
  </section>

  <section>
    <h2>Icons</h2>
    <s-button [iconLeading]="saveIcon" (pressed)="clickCount = clickCount + 1">Save</s-button>
  </section>

  <section>
    <h2>Loading</h2>
    <s-button [loading]="loading()" (pressed)="toggleLoading()">Submit</s-button>
    <button type="button" (click)="toggleLoading()">Toggle loading</button>
  </section>

  <p>Click count: {{ clickCount }}</p>
</main>
